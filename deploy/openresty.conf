# Location template for a dedicated personal-site HTTPS server.
# Existing OpenResty uses host networking in Docker; the application tree is
# not mounted there, so proxy both pages and images to the loopback service.
# Set server_name and TLS certificates in the enclosing server after DNS/ICP readiness.
location = /api/avatar {
    proxy_pass http://127.0.0.1:3080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
    client_max_body_size 1536k;
}
location ~ ^/api/((posts|works)/[0-9]+/cover|media)$ {
    proxy_pass http://127.0.0.1:3080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
    client_max_body_size 3m;
}
# Creating and editing long-form text must accommodate 50,000 Unicode characters.
# The backend keeps other methods at their original request limits.
location ~ ^/api/((posts|notes)(/[0-9]+)?|drafts/[A-Za-z0-9_-]+)(/commit)?/?$ {
    proxy_pass http://127.0.0.1:3080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
    client_max_body_size 1m;
}
location / {
    proxy_pass http://127.0.0.1:3080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
    client_max_body_size 64k;
}
