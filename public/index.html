<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f1f5f9">
  <title>RongGuang233 · 个人小站</title>
  <link rel="stylesheet" href="/katex/katex.min.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/image-editor.css">
  <script src="/marked.umd.js" defer></script>
  <script src="/katex/katex.min.js" defer></script>
  <script src="/marked-katex.umd.js" defer></script>
  <script src="/markdown.js" defer></script>
  <script src="/image-editor.js" defer></script>
  <script src="/writing-editor.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到内容</a>
  <header class="site-header">
    <a class="brand" href="#home">RongGuang<span>233</span></a>
    <nav class="site-nav" aria-label="主导航">
      <a href="#home" data-nav="home">首页</a>
      <a href="#posts" data-nav="posts">博客</a>
      <a href="#notes" data-nav="notes">笔记</a>
      <a href="#friends" data-nav="friends">友链</a>
    </nav>
    <div class="header-actions">
      <button class="search-toggle" id="search-toggle" aria-label="搜索公开内容"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg> <span>搜索</span></button>
      <button id="theme-toggle" aria-label="切换深色外观" title="切换深色外观">☾</button>
    </div>
  </header>
  <main id="main" tabindex="-1"><p class="loading">正在读取小站…</p></main>
  <footer class="site-footer"><span id="footer-name">RongGuang233 的个人小站</span><span>博客 · 笔记 · 作品 · 友链</span></footer>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <form id="form">
      <div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="close" aria-label="关闭">×</button></div>
      <div id="fields"></div>
      <div class="dialog-footer">
        <p id="form-error" role="alert"></p>
        <div class="dialog-actions"><span id="save-hint" class="hint"></span><button class="primary" id="save" type="submit">保存</button></div>
      </div>
    </form>
  </dialog>
  <dialog id="leave-dialog" aria-labelledby="leave-title">
    <div class="leave-copy"><h2 id="leave-title">有尚未保存的修改</h2><p>可以继续编辑，或放弃这次修改。已保存的内容不会受影响。</p></div>
    <div class="leave-actions"><button type="button" id="discard-changes">放弃修改</button><button type="button" class="primary" id="keep-editing" autofocus>继续编辑</button></div>
  </dialog>
  <div id="toast" role="status"></div>
</body>
</html>
